# ─────────────────────────────────────────────────────────────────────────────
# mosquitto.conf — Scooter Rental Platform
# Place this file at: C:\Program Files\mosquitto\mosquitto.conf
# Start with: mosquitto -v -c mosquitto.conf
# ─────────────────────────────────────────────────────────────────────────────

# Listen on port 1883 (open to all network interfaces)
listener 1883

# ── Authentication ─────────────────────────────────────────────────────────
# Disable anonymous connections — every client MUST provide credentials
allow_anonymous false

# Password file — generated by mosquitto_passwd (see setup guide below)
password_file C:\Program Files\mosquitto\passwd.txt

# ── ACL (Access Control List) ─────────────────────────────────────────────
# Controls which users can publish/subscribe to which topics
acl_file C:\Program Files\mosquitto\acl.txt

# ── Logging ────────────────────────────────────────────────────────────────
log_type all
log_dest stdout

# ── Performance ────────────────────────────────────────────────────────────
max_queued_messages 1000
message_size_limit  65536
